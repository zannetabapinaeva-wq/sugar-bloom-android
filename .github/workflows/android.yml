name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build bundled frontend
        run: |
          npm ci
          npm run build
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Prepare download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/sugar-bloom.apk
          sha256sum release/sugar-bloom.apk > release/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/sugar-bloom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sugar-bloom-apk
          path: release/*
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/sugar-bloom.apk release/SHA256SUMS.txt --title "Sugar Bloom Android 1.0.${GITHUB_RUN_NUMBER}" --notes-file RELEASE-NOTES.md --latest --target "$GITHUB_SHA"
